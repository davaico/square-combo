[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
addopts = 
    -v
    --tb=short
    --strict-markers
markers =
    unit: Unit tests with mocked dependencies
    integration: Integration tests with real API calls
    slow: Tests that take a long time to run
