limit_req_zone $binary_remote_addr zone=onboarding:10m rate=30r/m;

server {
    listen 80;
    server_name square-combo.example.com;
    # certbot installs TLS and redirects after domain/DNS provisioning.
    client_max_body_size 16k;
    client_body_timeout 15s;
    location / {
        limit_req zone=onboarding burst=10 nodelay;
        # Avoid retaining OAuth codes or query strings in access logs.
        access_log off;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    # Aggregate operational endpoints are available only on loopback.
    location = /metrics {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }
}
