[project]
name = "square-combo"
version = "0.1.0"
description = "Daily revenue synchronization from Square to Combo"
requires-python = ">=3.12"
license = "LGPL-3.0-only"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI dependencies are intentionally declared in defaults.

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--strict-markers --strict-config -ra --cov=adapters --cov=services --cov=tasks --cov=routes --cov=database --cov=utils --cov=main --cov-branch --cov-report=term-missing --cov-fail-under=85"
markers = ["live: opt-in read-only requests to dedicated provider test accounts"]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["adapters", "services", "tasks", "routes", "database", "utils", "main"]
omit = ["database/__main__.py"]

[tool.coverage.report]
exclude_also = ["if __name__ == .__main__.:"]
