name: Deploy to VM

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to VM via SSH
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            APP_DIR=/home/${{ secrets.VM_USER }}/apps/square-combo
            VENV_DIR=$APP_DIR/venv

            mkdir -p $APP_DIR

            if [ ! -d "$APP_DIR/.git" ]; then
              git clone git@github.com:davaico/square-combo.git . $APP_DIR
            else
              cd $APP_DIR
              git fetch origin master
              git reset --hard origin/master
            fi

            if [ ! -d "$VENV_DIR" ]; then
              python3 -m venv $VENV_DIR
            fi

            source $VENV_DIR/bin/activate

            pip install --upgrade pip
            pip install -r $APP_DIR/requirements.txt

            sudo systemctl restart square-combo || \
              (echo "Service not found, please create /etc/systemd/system/square-combo.service")
